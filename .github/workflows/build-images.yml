name: build-images

# Build the uncompressed erofs, ext4, ufs and zfs images of the golden image
# dataset and publish them as a release, split into parts of at most 1 GB.
#
#   dataset       download the dataset once, so that all images share it
#   linux-images  erofs and ext4, built on the Linux runner
#   ufs, zfs      built with the makefs of a FreeBSD virtual machine,
#                 one job per file system, in parallel
#   release       pack, split and publish
#
# Unpack the release with: cat benchmark-images.tar.gz.* | tar -xzf -
# No cache is used anywhere and every artifact is kept for one day.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag, default images-<date>-<run number>
        required: false
        type: string

permissions:
  contents: write

jobs:
  dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            e2fsprogs android-sdk-libsparse-utils unzip curl

      # Root is needed: debugfs rdump restores the owners of the Android files
      # (uid 0, 2000, ...), and some files are not readable by other users. The
      # owners end up in the images, so they must survive into the tarball.
      - name: fetch the dataset
        run: |
          sudo scripts/host/fetch-dataset.sh -p full work/dataset work/cache
          sudo rm -rf work/cache
          sudo tar -C work -czf work/dataset.tar.gz dataset
          sudo chown "$(id -u):$(id -g)" work/dataset.tar.gz
          ls -l work/dataset.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: dataset
          path: work/dataset.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  linux-images:
    needs: dataset
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends erofs-utils e2fsprogs

      - uses: actions/download-artifact@v4
        with:
          name: dataset
          path: work

      # Root again, to keep the owners of the dataset and to read all files.
      - name: build erofs and ext4
        run: |
          sudo tar -C work -xzf work/dataset.tar.gz
          rm work/dataset.tar.gz
          sudo scripts/host/build-images.sh -n -v "erofs-none ext4" \
            work/dataset work/out
          sudo chown -R "$(id -u):$(id -g)" work/out
          ls -l work/out/img

      - uses: actions/upload-artifact@v4
        with:
          name: image-linux
          path: |
            work/out/img/erofs-none.img
            work/out/img/ext4.img
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  freebsd-images:
    needs: dataset
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        variant: [ufs, zfs]
    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/download-artifact@v4
        with:
          name: dataset
          path: work

      # nfs maps every user of the virtual machine to the runner user, so the
      # owners of the dataset would be lost there. The tarball is therefore
      # unpacked as root onto a tmpfs inside the machine, and only the image is
      # written back to the shared workspace.
      - name: build the ${{ matrix.variant }} image in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15"
          sync: nfs
          mem: 10240
          disable-cache: true
          run: |
            freebsd-version
            mkdir -p /mnt/ds
            mount -t tmpfs -o size=4g tmpfs /mnt/ds
            tar -C /mnt/ds -xzf work/dataset.tar.gz
            sh scripts/freebsd/build-images.sh -v ${{ matrix.variant }} \
              /mnt/ds/dataset work/${{ matrix.variant }}.img

      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.variant }}
          path: work/${{ matrix.variant }}.img
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  release:
    needs: [linux-images, freebsd-images]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          path: work/img
          merge-multiple: true

      - name: pack and split
        run: |
          ls -l work/img
          scripts/linux/package-images.sh work/img work/release

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-images
          path: work/release/benchmark-images.tar.gz.*
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          tag=${TAG_INPUT:-images-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}}
          gh release create "$tag" work/release/benchmark-images.tar.gz.* \
            --title "$tag" \
            --notes "Uncompressed erofs, ext4, ufs and zfs images of the golden image dataset. Unpack with: cat benchmark-images.tar.gz.* | tar -xzf -"
